[project]
name = "wrenchroom"
# Single-sourced from the package: `wrenchroom.__version__` and the installed distribution
# must never name different releases in the same bug report. See `[tool.hatch.version]`
# and `tests/test_version.py`, which asserts they agree.
dynamic = ["version"]
description = "Checks that a real hand tool can reach, turn and remove every fastener in a mechanical assembly."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0 AND MIT"
# The SPDX expression alone puts the identifier in METADATA and ships no grant text;
# Apache-2.0 section 4(a) requires the copy to travel with the distribution, and a
# compliance scan looks for the file, not the identifier. Decided 2026-10-06: Apache
# over MIT for the explicit patent grant, which matters in a space with commercial
# players. The MIT half is three.js, bundled into the HTML view
# (src/wrenchroom/view/vendor/); its licence travels in the wheel and in every page.
license-files = ["LICENSE", "src/wrenchroom/view/vendor/three.LICENSE"]
authors = [{ name = "Kevin O'Neil", email = "kevin@oneil.xyz" }]
keywords = [
  "cad",
  "step",
  "assembly",
  "fasteners",
  "serviceability",
  "dfa",
  "build123d",
]
classifiers = [
  # Alpha: the checks work on real models, and their outputs may still change
  # between releases. Moves with the milestones.
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Manufacturing",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
# Floors are the versions this stack was resolved and verified against on 2026-10-06, for
# CPython 3.13 and 3.14 on macOS arm64 and Linux x86_64, not the oldest that might work.
# A claim about an untested older version would be recalled from memory, and the one
# dependency that matters here is binary: build123d 0.13 pulls cadquery-ocp-novtk 8.0.x,
# which is the headless OCP wheel and the reason this project can run in CI at all.
#
# manifold3d is the mesh collision engine, decided by benchmark at M3 (2026-10-06): on
# the 686 tool-part tests the golden bench makes it agreed with the exact OCP engine on
# every one, at about 0.1 ms a test. python-fcl (through trimesh.collision, the other
# route the spec allowed) was twice as fast and missed 10 real hits, each a probe lying
# wholly inside a plate, which a surface BVH cannot see. trimesh was here only for that
# route and has gone with it. The full reasoning is in src/wrenchroom/engine/mesh.py.
dependencies = [
  "build123d>=0.13",
  "click>=8.5",
  "manifold3d>=3.5",
  "numpy>=2.5",
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/kmoneil/wrenchroom"
Source = "https://github.com/kmoneil/wrenchroom"
Issues = "https://github.com/kmoneil/wrenchroom/issues"
Documentation = "https://github.com/kmoneil/wrenchroom/blob/main/docs/reference.md"
Changelog = "https://github.com/kmoneil/wrenchroom/releases"

[project.scripts]
wrenchroom = "wrenchroom.cli:main"

# The pytest plugin (spec 10.5): a `wrenchroom_report` fixture, configured in the
# project's pytest settings. Inert until a test asks for it; `-p no:wrenchroom` disables it.
[project.entry-points.pytest11]
wrenchroom = "wrenchroom.pytest_plugin"

[dependency-groups]
dev = [
  "markdown-it-py[linkify]>=4.2.0",
  "pillow>=12.3.0",
  "pytest>=8.3",
  "ruff>=0.14",
  "ty>=0.0.1a10",
]

# Pillow is overridden past a published upper bound. It arrives through build123d ->
# threejs-materials, and every threejs-materials release so far (1.2.4, 2026-09-27) pins
# pillow<12.3.0; 12.2.0 carries 13 advisories fixed in 12.3.0 (image decoders: fonts,
# EPS, JPEG2000, TGA, PDF streams). wrenchroom never decodes an image, but the lock is
# what CI and every developer installs, so it carries the fixed release. The evidence
# that build123d still works on it is the whole suite passing. This only affects the
# lock: an install from an index still resolves threejs-materials' own bound. Remove it
# once https://github.com/bernhard-42/threejs-materials/issues/1 lands upstream.
[tool.uv]
override-dependencies = ["pillow>=12.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/wrenchroom/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wrenchroom"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",     # pycodestyle
  "F",          # pyflakes
  "I",          # isort
  "N",          # pep8-naming
  "UP",         # pyupgrade
  "B",          # bugbear
  "A",          # builtins shadowing
  "C4",         # comprehensions
  "C90",        # mccabe
  "DTZ",        # naive datetimes
  "T20",        # no print in shipped code
  "PT",         # pytest style
  "RET",        # return simplification
  "SIM",        # simplify
  "SLF",        # private member access
  "TID",        # tidy imports
  "PTH",        # pathlib over os.path
  "ERA",        # commented-out code
  "PL",         # pylint
  "TRY",        # exception antipatterns
  "RUF",
  "S",          # bandit
  "D",          # pydocstyle, Google convention
  "ANN",        # annotations required
]
ignore = [
  "D105",    # magic method docstrings
  "D107",    # __init__ docstring: documented on the class
  "TRY003",  # messages are the payload here: NotCovered's text IS the report's reason,
             # ConfigError's text names the file and rule; a message class per spelling
             # would scatter what the reader needs in one place
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
# The defaults assume arity signals complexity. The sweep builders take independent
# geometric parameters (a mount, a tool's numbers, the scene, the sampling step), and
# bundling them into a parameter object would move the same fields somewhere else
# rather than remove any. 8 is the project ceiling; a function wanting more than that
# is genuinely doing too much.
max-args = 8
max-positional-args = 8

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.per-file-ignores]
# The CLI defers its heavy imports (build123d pulls OCP, seconds) into the commands
# that need them, so --help and --version stay instant. That is the one place
# function-level imports are the point rather than an accident.
"src/wrenchroom/cli.py" = ["PLC0415"]
# Tests are exempt from docstring and annotation gates and from bandit's assert rule.
# They are NOT exempt from correctness lints.
"tests/**" = ["D", "ANN", "S101", "PLR2004", "T20"]
# scripts/ is developer tooling: printing the lane table is what lanes.py does, so T20
# would be a rule against the program. S603 goes with it: it spawns tools by resolved
# absolute path with a list argv and no shell, which is the checked-for property rather
# than the flagged one. Docstrings and annotations are NOT exempt here.
"scripts/**" = ["T20", "S603"]
# examples/ is what a reader runs: saying what it wrote is the program's output.
"examples/**" = ["T20"]

# ---------------------------------------------------------------------------
# ty, the type gate, scoped to shipped code
# ---------------------------------------------------------------------------
[tool.ty.src]
include = ["src"]

[tool.ty.environment]
python = ".venv"

# ty reports a deprecated call as a warning, and a warning does not fail `ty check`.
# A rule that reports without failing is a rule nobody reads, so it is escalated.
[tool.ty.rules]
deprecated = "error"

# assembly.py (the XCAF STEP walk) and the engine (tessellation, quick boxes) talk
# to OCP (OpenCascade) directly, and the cadquery-ocp wheel is compiled modules
# with no stubs, so ty cannot resolve any member of them. Not fixable at the
# source (upstream ships no py.typed); scoped to the files that import OCP rather
# than waived globally. Revisit if an ocp-stubs release matching OCP 8.x appears;
# then this section goes and the stubs come in as a dev dependency.
[[tool.ty.overrides]]
include = [
  "src/wrenchroom/assembly.py",
  "src/wrenchroom/engine/mesh.py",
  "src/wrenchroom/engine/scene.py",
]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]
