# Continuous integration for wrenchroom.
#
# Every lane is invoked through `scripts/lanes.py`, never by spelling out a tool's
# command here. Two spellings of "how this project runs its checks" is how a flag
# exists locally and not in CI, or the other way round.
#
# Third-party actions are pinned to a commit SHA with the tag in a trailing comment.
# A floating tag is a mutable reference to somebody else's code with a token in scope.
# Dependabot keeps the pins from going stale silently; re-pin deliberately, reading the
# diff, rather than by moving the tag.
#
# Both Pythons the project claims (3.13 the floor, 3.14 current) and both platforms the
# CAD stack has wheels for in CI (Linux x86_64, macOS arm64). The OCP wheel is the
# headless `cadquery-ocp-novtk`, which is what lets this run on a runner at all.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static gates: ruff lint, ruff format, ty. Linux only; nothing these tools check is
  # platform-dependent.
  gates:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen
      - run: uv run --frozen python scripts/lanes.py gates

  # The unit suite on every platform and Python the project claims. The HTML view's
  # tests use the Node and Chrome the runner images come with; under CI a missing
  # one fails the run instead of skipping (tests/golden/test_view_browser.py).
  fast:
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --frozen --python ${{ matrix.python }}
      - run: uv run --frozen python scripts/lanes.py fast
        env:
          WRENCHROOM_ARTIFACTS: ${{ runner.temp }}/view
      # The golden bench's HTML report and what headless Chrome drew of it, to open
      # or look at; one copy per platform.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && matrix.python == '3.13'
        with:
          name: bench-view-${{ matrix.os }}
          path: ${{ runner.temp }}/view
          if-no-files-found: warn
          retention-days: 14

  # The speed target: the golden bench scaled to 500 fasteners, read and checked
  # inside 10 s. The timing REPORTS for now (the perf-report lane writes it to
  # the run summary and doesn't gate on it): hosted runners are slower and
  # noisier than the laptop the target is set for. The verdict counts DO gate,
  # so this is also a 500-fastener correctness run on every push. Once a few
  # weeks of numbers show where the runners sit, switch to the gating perf lane
  # with the budget those numbers support.
  perf:
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen --python 3.13
      - run: uv run --frozen python scripts/lanes.py perf-report
