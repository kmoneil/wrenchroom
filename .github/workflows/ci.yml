# Continuous integration for wrenchroom.
#
# Every lane is invoked through `scripts/lanes.py`, never by spelling out a tool's
# command here. Two spellings of "how this project runs its checks" is how a flag
# exists locally and not in CI, or the other way round.
#
# Third-party actions are pinned to a commit SHA with the tag in a trailing comment.
# A floating tag is a mutable reference to somebody else's code with a token in scope.
# Dependabot keeps the pins from going stale silently; re-pin deliberately, reading the
# diff, rather than by moving the tag.
#
# Both Pythons the project claims (3.13 the floor, 3.14 current) and both platforms the
# CAD stack has wheels for in CI (Linux x86_64, macOS arm64). The OCP wheel is the
# headless `cadquery-ocp-novtk`, which is what lets this run on a runner at all.
#
# macOS runs on the floor only, and on pull requests, not on the push to main that
# merges one: a macOS minute costs about ten Linux ones in GitHub's usage, and the PR
# has already run the change there. Main's run is Linux, both Pythons, which still
# catches what a merge breaks by meeting another. A manual run (workflow_dispatch)
# runs what a PR does.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static gates: ruff lint, ruff format, ty. Linux only; nothing these tools check is
  # platform-dependent.
  gates:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen
      - run: uv run --frozen python scripts/lanes.py gates

  # The unit suite on every platform and Python the project claims, macOS as above.
  # The HTML view's tests use the Node and Chrome the runner images come with; under
  # CI a missing one fails the run instead of skipping (tests/golden/test_view_browser.py).
  # The lane runs a worker to every core the runner counts, a test file to a worker.
  # A row takes 12 to 19 minutes on Linux by the processor its runner draws (five
  # models in one day's runs, the bench at 182 fasteners) and 20 on macOS; in one
  # process it took 23 to 34. A row cancelled at its limit is run again from the
  # start: the limit leaves that spread room, and the bench room to grow.
  fast:
    timeout-minutes: 40
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
        python: ["3.13", "3.14"]
        exclude:
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --frozen --python ${{ matrix.python }}
      - run: uv run --frozen python scripts/lanes.py fast
        env:
          WRENCHROOM_ARTIFACTS: ${{ runner.temp }}/view
      # The golden bench's HTML report and what headless Chrome drew of it, to open
      # or look at; one copy per platform.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.python == '3.13'
        with:
          name: bench-view-${{ matrix.os }}
          path: ${{ runner.temp }}/view
          if-no-files-found: warn
          retention-days: 14

  # The speed target: the golden bench scaled to 500 fasteners, read and checked
  # inside 10 s. The timing REPORTS for now (the perf-report lane writes it to
  # the run summary and doesn't gate on it): hosted runners are slower and
  # noisier than the laptop the target is set for. The verdict counts DO gate,
  # so this is also a 500-fastener correctness run on every push. Once a few
  # weeks of numbers show where the runners sit, switch to the gating perf lane
  # with the budget those numbers support. macOS as above.
  perf:
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen --python 3.13
      - run: uv run --frozen python scripts/lanes.py perf-report
